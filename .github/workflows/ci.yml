name: CI

on:
  push:
    branches: [main]
  pull_request:
  # IMPLEMENTATION_PLAN.md Task 16.2: makes every job below reusable by
  # .github/workflows/canary.yml, which calls this workflow with
  # modelable_ref set to an upstream branch/tag/commit instead of the
  # pinned .modelable-version release. `modelable_ref` is left unset (empty
  # string) on ordinary push/pull_request triggers, which is exactly
  # scripts/install-modelable.sh's own signal to install the pinned release
  # instead of canary mode - no separate branching needed here.
  workflow_call:
    inputs:
      modelable_ref:
        description: "Modelable git ref (branch/tag/commit) to install instead of the pinned release. Empty = pinned release."
        required: false
        type: string
        default: ""

# Toolchain pinning (IMPLEMENTATION_PLAN.md Task 16.1): every job pins an
# exact version so this workflow is deterministic on first implementation -
# Dependabot/Renovate may take over bumping these later. Modelable itself
# (.modelable-version) and protoc (.protoc-version) are pinned in-repo
# already; `make bootstrap` installs both from those files. The postgres/
# clickhouse service image tags below must be kept in sync with
# docker-compose.yml's - `services.<id>.image` doesn't have access to the
# `env` context, so they can't be centralized into one env var here.
env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"
  JAVA_VERSION: "21"
  GO_VERSION: "1.26.x"
  MODELABLE_REF: ${{ inputs.modelable_ref }}

jobs:
  # Path-based job gating: each job below only runs if its own inputs
  # changed, so an apps/web-only PR doesn't also pay for rust/java/go
  # toolchain setup and generation. `shared` (aliased into every other
  # filter) covers anything that can ripple into *every* generated target -
  # the .mdl model itself, the pinned toolchain versions, the shared
  # generate/determinism scripts, and this workflow file - so a change
  # there still runs the full matrix, same as before this job existed.
  #
  # This filtering only applies to `push`/`pull_request` triggers, which are
  # the only ones with a real "changed since what" diff. canary.yml's
  # workflow_call invocation is testing the *same* model against a
  # different Modelable compiler build, not a code diff - there is nothing
  # to filter, and skipping jobs there would defeat the point of a canary
  # run - so every filter output defaults to true for any other trigger.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      model: ${{ steps.filter.outputs.model || steps.fallback.outputs.model }}
      generate: ${{ steps.filter.outputs.generate || steps.fallback.outputs.generate }}
      rust: ${{ steps.filter.outputs.rust || steps.fallback.outputs.rust }}
      csharp: ${{ steps.filter.outputs.csharp || steps.fallback.outputs.csharp }}
      java: ${{ steps.filter.outputs.java || steps.fallback.outputs.java }}
      python_lang: ${{ steps.filter.outputs.python_lang || steps.fallback.outputs.python_lang }}
      go: ${{ steps.filter.outputs.go || steps.fallback.outputs.go }}
      protobuf_grpc: ${{ steps.filter.outputs.protobuf_grpc || steps.fallback.outputs.protobuf_grpc }}
      databases: ${{ steps.filter.outputs.databases || steps.fallback.outputs.databases }}
      product: ${{ steps.filter.outputs.product || steps.fallback.outputs.product }}
      e2e: ${{ steps.filter.outputs.e2e || steps.fallback.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - name: Path filters
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - 'model/**'
              - '.modelable-version'
              - '.protoc-version'
              - 'Makefile'
              - 'scripts/generate-all.py'
              - 'scripts/check-determinism.py'
              - 'scripts/modelable-env.sh'
              - 'scripts/install-modelable.sh'
              - 'scripts/install-protoc.sh'
              - '.github/workflows/ci.yml'
            model:
              - *shared
              - 'tests/conformance/**'
              - 'scripts/check-capability-coverage.py'
            generate:
              - *shared
            rust:
              - *shared
              - 'apps/api/**'
              - 'tests/integration/test_rust_codegen.py'
            csharp:
              - *shared
              - 'probes/csharp/**'
              - 'tests/integration/test_csharp_codegen.py'
            java:
              - *shared
              - 'probes/java/**'
              - 'tests/integration/test_java_codegen.py'
            python_lang:
              - *shared
              - 'probes/python/**'
              - 'tests/integration/test_python_codegen.py'
              - 'tests/integration/test_avro_codegen.py'
            go:
              - *shared
              - 'probes/go/**'
              - 'tests/integration/test_go_codegen.py'
            protobuf_grpc:
              - *shared
              - 'tests/integration/test_protobuf_codegen.py'
            databases:
              - *shared
              - 'tests/integration/test_postgres_generated_schema.py'
              - 'tests/integration/test_clickhouse_generated_schema.py'
              - 'tests/integration/test_openapi_checkpoint.py'
              - 'tests/integration/test_openapi_contract.py'
              - 'tests/conformance/test_registry_ids.py'
              - 'scripts/setup-full-database.py'
              - 'docker-compose.yml'
            product:
              - *shared
              - 'apps/api/**'
              - 'apps/web/**'
              - 'docker-compose.yml'
              - 'scripts/setup-full-database.py'
            e2e:
              - *shared
              - 'apps/api/**'
              - 'apps/web/**'
              - 'tests/e2e/**'
              - 'docker-compose.yml'
              - 'scripts/setup-full-database.py'
      - name: Run everything (non-push/pull_request trigger, e.g. canary)
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: fallback
        run: |
          for name in model generate rust csharp java python_lang go protobuf_grpc databases product e2e; do
            echo "${name}=true" >> "$GITHUB_OUTPUT"
          done

  model:
    name: model (validate + compat)
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - name: make bootstrap
        run: make bootstrap
      - name: make validate
        run: make validate
      - name: make compat
        run: make compat

  generate:
    name: generate (+ determinism)
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: make determinism
        run: make determinism
      - name: Upload generated manifest on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generate-failure-manifest
          path: |
            generated/manifest.json
            .modelable/
          if-no-files-found: ignore
          retention-days: 7

  # --- languages: rust/typescript/csharp/java/python/go/protobuf-grpc -----
  # Separate single-purpose jobs, not one matrix - each language needs a
  # distinct toolchain setup step, so a matrix would just push the same
  # per-entry conditionals into `with:` blocks without saving any real
  # duplication (IMPLEMENTATION_PLAN.md Task 16.1 explicitly allows this:
  # "correctness is more important than aesthetic symmetry"). TypeScript's
  # codegen proof lives in the `product` job instead of a dedicated job here
  # - apps/web's `tsc -b` build against the generated TypeScript types *is*
  # the compile probe, and there is no separate probes/typescript/ project
  # the way there is for csharp/java/python/go, so a standalone lang-
  # typescript job here would just rebuild apps/web a second time.

  lang-rust:
    name: languages / rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/api -> target"
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Rust codegen probe
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_rust_codegen.py
      - name: Build generated Rust crates + apps/api
        run: cargo build --manifest-path apps/api/Cargo.toml --all-targets

  lang-csharp:
    name: languages / csharp
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: probes/csharp/packages.lock.json
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: C# codegen probe
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_csharp_codegen.py
      - name: dotnet test probes/csharp
        run: dotnet test probes/csharp

  lang-java:
    name: languages / java
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: probes/java/pom.xml
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Java codegen probe
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_java_codegen.py
      - name: mvn test probes/java
        working-directory: probes/java
        run: mvn -q -B test

  lang-python:
    name: languages / python
    needs: changes
    if: needs.changes.outputs.python_lang == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Python codegen probe
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_python_codegen.py tests/integration/test_avro_codegen.py
      - name: probes/python pytest
        working-directory: probes/python
        run: uv run pytest -q

  lang-go:
    name: languages / go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: probes/go/go.mod
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Go codegen probe
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_go_codegen.py
      - name: probes/go go test
        working-directory: probes/go
        run: go test ./...

  lang-protobuf-grpc:
    name: languages / protobuf-grpc
    needs: changes
    if: needs.changes.outputs.protobuf_grpc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Protobuf/gRPC codegen probe (includes --descriptor-set)
        run: . ./scripts/modelable-env.sh && uv run pytest -q tests/integration/test_protobuf_codegen.py

  # --- databases: generated DDL applies to a real Postgres/ClickHouse -----

  databases:
    name: databases (generated schema + DB-backed integration tests)
    needs: changes
    if: needs.changes.outputs.databases == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: showcase
          POSTGRES_PASSWORD: showcase
          POSTGRES_DB: showcase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showcase -d showcase"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_USER: showcase
          CLICKHOUSE_PASSWORD: showcase
          CLICKHOUSE_DB: showcase
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user showcase --password showcase --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: make integration
        run: make integration

  # --- product: the actual showcase API + web app -------------------------

  product:
    name: product (apps/api + apps/web)
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: showcase
          POSTGRES_PASSWORD: showcase
          POSTGRES_DB: showcase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showcase -d showcase"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_USER: showcase
          CLICKHOUSE_PASSWORD: showcase
          CLICKHOUSE_DB: showcase
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user showcase --password showcase --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/api -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: make bootstrap
        run: make bootstrap
      - name: make generate
        run: make generate
      - name: Apply full generated schema (apps/api's tests expect it to already exist)
        run: . ./scripts/modelable-env.sh && uv run scripts/setup-full-database.py
      - name: cargo test apps/api
        run: cargo test --manifest-path apps/api/Cargo.toml
      - name: apps/web install
        working-directory: apps/web
        run: npm install
      - name: apps/web lint
        working-directory: apps/web
        run: npm run lint
      - name: apps/web test
        working-directory: apps/web
        run: npm test -- --run
      - name: apps/web build
        working-directory: apps/web
        run: npm run build

  # --- e2e: full Compose stack + Playwright --------------------------------

  e2e:
    name: e2e (Compose + Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-python: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: make bootstrap
        run: make bootstrap
      - name: make e2e
        run: make e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
