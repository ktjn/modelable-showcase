name: Renovate

# Self-hosted weekly run (repo's own workflow, not the Renovate GitHub App -
# nothing else in this repo depends on that app being installed). Config
# lives in renovate.json at the repo root: every ecosystem Renovate can
# detect here (npm, cargo, pip/pep621, gomod, maven, nuget, dockerfile,
# docker-compose, github-actions) is enabled, and every PR it opens is set
# to auto-merge once CI (.github/workflows/ci.yml, already pull_request-
# triggered) passes - no manual approval step by default.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC, matching renovate.json's schedule
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # `token` must be a PAT (repo-scoped classic, or fine-grained with
      # contents:write + pull-requests:write - a classic token is still the
      # safer default per this action's own README: fine-grained tokens
      # only gained GitHub GraphQL support recently and still have gaps
      # around Checks access, which can break automerge), not the default
      # GITHUB_TOKEN: GitHub does not fire pull_request-triggered workflows
      # (ci.yml) for PRs authored with GITHUB_TOKEN, which would silently
      # leave every Renovate PR's checks stuck pending and automerge never
      # firing. Add it under Settings > Secrets and variables > Actions.
      #
      # Passed via the `token` input (not a RENOVATE_TOKEN env var) to match
      # this action's own documented usage exactly, rather than relying on
      # its env-regex passthrough behaving the same way.
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: "44.34.3"
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          LOG_LEVEL: info
