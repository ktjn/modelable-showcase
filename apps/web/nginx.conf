# Serves the built SPA and proxies the same paths vite.config.ts's dev
# server proxies to apps/api, so src/api/client.ts's same-origin relative
# paths (default VITE_API_BASE_URL = '') work unchanged in this container.
# apps/api has no CORS middleware, so a direct cross-origin browser fetch to
# it would fail (see vite.config.ts's comment) - this proxy keeps everything
# same-origin from the browser's perspective instead.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8080/api/;
    }

    location = /openapi.json {
        proxy_pass http://api:8080/openapi.json;
    }

    location = /docs {
        proxy_pass http://api:8080/docs;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
