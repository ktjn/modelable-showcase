name: modelable-showcase
# Development-only services for the showcase (IMPLEMENTATION_PLAN.md Phase 8,
# api/web added in Task 11.1). The PostgreSQL service pins an explicit major
# version, binds to localhost only, uses synthetic development credentials,
# keeps data in a named volume, and is isolated on its own network.
#
# `docker compose up --build` needs no manual pre-step: apps/api/Dockerfile
# and apps/web/Dockerfile each have their own self-contained generator stage
# that installs the pinned Modelable CLI and compiles model/ from scratch
# (Task 11.1's option 2 design - see those Dockerfiles' header comments).
# There is no separate `generator` service here because of that.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
      POSTGRES_DB: showcase
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - showcase-net
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: showcase
      CLICKHOUSE_PASSWORD: showcase
      CLICKHOUSE_DB: showcase
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "showcase", "--password", "showcase", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - showcase-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SHOWCASE_API_ADDR: 0.0.0.0:8080
      SHOWCASE_PG_HOST: postgres
      SHOWCASE_PG_PORT: "5432"
      SHOWCASE_PG_USER: showcase
      SHOWCASE_PG_PASSWORD: showcase
      SHOWCASE_PG_DBNAME: showcase
      SHOWCASE_CH_HOST: clickhouse
      SHOWCASE_CH_PORT: "8123"
      SHOWCASE_CH_USER: showcase
      SHOWCASE_CH_PASSWORD: showcase
      SHOWCASE_CH_DBNAME: showcase
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - showcase-net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks:
      - showcase-net
    restart: unless-stopped

  # Optional Task 15.2 integration profile: `modelable publish
  # apicurio`/`pull apicurio` against a real Apicurio Registry. Not part of
  # ordinary `docker compose up` - only starts under the `apicurio` profile
  # (`docker compose --profile apicurio up -d apicurio`, or via `make
  # integration-apicurio`). The in-memory variant needs no persistence
  # config for a disposable local integration test.
  apicurio:
    image: apicurio/apicurio-registry:3.0.6
    profiles:
      - apicurio
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/apis/registry/v3/system/info"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - showcase-net
    restart: unless-stopped

  # Optional Task 15.3 integration profile: `modelable sync --lineage
  # marquez` against a real Marquez/OpenLineage backend. Not part of
  # ordinary `docker compose up` - only starts under the `marquez` profile
  # (`docker compose --profile marquez up -d marquez`, or via `make
  # integration-marquez`). Marquez hard-requires its own dedicated
  # PostgreSQL (not the showcase's `postgres` service - Marquez runs its
  # own Flyway migrations against it and expects db/user/password all
  # named "marquez", matching marquez.dev.yml's baked-in defaults), so
  # this profile is two containers, both disposable/no host volumes.
  # SEARCH_ENABLED=false skips Marquez's optional OpenSearch dependency,
  # which this showcase's read-only lineage-sync check does not need.
  marquez-db:
    image: postgres:17-alpine
    profiles:
      - marquez
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - showcase-net
    restart: unless-stopped

  marquez:
    image: marquezproject/marquez:0.50.0
    profiles:
      - marquez
    environment:
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      SEARCH_ENABLED: "false"
    ports:
      - "127.0.0.1:5010:5000"
      - "127.0.0.1:5011:5001"
    depends_on:
      marquez-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - showcase-net
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:

networks:
  showcase-net: